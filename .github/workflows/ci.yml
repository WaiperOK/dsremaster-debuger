name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Debug x64
        run: msbuild DarkSoulsDebugMenu.sln /p:Configuration=Debug /p:Platform=x64 /m
      - name: Build Release x64
        run: msbuild DarkSoulsDebugMenu.sln /p:Configuration=Release /p:Platform=x64 /m
